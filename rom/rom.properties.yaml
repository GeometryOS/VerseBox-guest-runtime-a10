# ---------------------------------------------------------------- ROM 自述（输入）
#
# 这个文件属于**运行时仓库**（guest-runtime-a10），不属于 app。它保存 A10 ROM 的「身份」。
# 规范见 app 仓库的 docs/rom-package/02-ROM包结构与命名.md 与 04-APK与ROM的边界.md。
#
# A9 / A10 / A15 是三个独立仓库：本仓库自带自己的打包器（rom/pack-rom.py）、
# hash 实现（rom/rom_hash.py）与 APK 侧 stager（rom/stage-apk-payload.py），
# **不引用别的仓库的脚本**。只 clone 本仓库（外加一份参考 APK）就能出包：
#
#   python scripts/extract-a10-inputs.py --apk ../../_bin/A10VM.apk   # 或 --from-runtime-inputs
#   python rom/pack-rom.py --prepared prepared
#   python rom/stage-apk-payload.py --prepared prepared --out prepared-apk
#
# apiLevel 不在这里写：它由 prepared 的清单（guestSdk=29）决定，写了就必须与之一致。
# payloadBytes / payloadSha256 由打包器按实际内容算出来。
# versionPointer 由维护者选定为精确版本或 maxcv；minAppVersionCode 是 app versionCode 的下限。
# pack-audit-intent.json 在出包时自动生成，不能手写进仓库。
schema: versebox-rom-properties/1
id: android10
name: Android 10
androidVersion: "10"
description: AOSP10 虚拟机
defaultRomVersion: 1.0.1
versionPointer: maxcv
minAppVersionCode: 105

# 客体 .so 的承载方式（docs/rom-package/04 §3.3）：apk / rom / both。
# A10 与 A15 同一套判据：App 进程在 u:r:untrusted_app 域，对 app_data_file 有 execute
# 但没有 execute_no_trans，所以**被 dlopen 的库**可以下沉到 ROM 的 payload/lib，
# **被 execve 的文件**必须留在 APK 的 lib/（逐个列在 rom/resident-native.txt）。
libMode: rom